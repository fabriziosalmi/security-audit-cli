name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} / go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.24.x', '1.25.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l cmd/ internal/)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            exit 1
          fi
      - name: Run go vet
        run: go vet ./...
      - name: Build binary
        run: go build -v -trimpath -o sec-audit ./cmd/sec-audit
      - name: Run race-enabled test suite
        run: go test -count=1 -race -cover -timeout 120s ./...
      - name: Run deterministic fuzz harnesses (smoke)
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.25.x'
        run: |
          go test -fuzz=FuzzValidateFindingsBytes -fuzztime=2s ./internal/validator
          go test -fuzz=FuzzValidateCoverageLedgerBytes -fuzztime=2s ./internal/validator
          go test -fuzz=FuzzValidateJSONPreflight -fuzztime=2s ./internal/validator
          go test -fuzz=FuzzDeriveCoverageID -fuzztime=2s ./internal/validator

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
