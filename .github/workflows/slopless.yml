name: slopless

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: AI-slop static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run slopless
        uses: fabriziosalmi/slopless@46b53d641204290c8cef061b76b225dba912ff8a # v1.18.1
        with:
          patterns: "cmd/**/*.go internal/**/*.go *.md"
          format: sarif
          output: slopless.sarif
      - name: Upload findings to code scanning
        id: upload
        if: >-
          always()
          && hashFiles('slopless.sarif') != ''
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: slopless.sarif
          category: slopless
